# =========================
# 1) pubspec.yaml
# =========================
name: tokosai_shift_viewer
description: Tokosai shift viewer prototype (Flutter)
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ステップ2：URLからCSV取得
  http: ^1.2.2

  # CSVパース
  csv: ^6.0.0

  # ローカル永続化（イベント日付、既定URL、取り込んだデータ等）
  shared_preferences: ^2.3.2

  # 日付フォーマットなど
  intl: ^0.19.0

  # ステップ3（後で追加）
  # file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sample_assignments.csv


